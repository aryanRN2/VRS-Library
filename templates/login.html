{% extends 'base.html' %}
{% block content %}
<a href="/" class="brand-logo">VRS LIBRARY</a>

<div class="hero-content-wrapper auth-wrapper">
    <h1 class="auth-title">Sign In</h1>
    <p class="minimal-tagline">Secure access to your VRS dashboard.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            <i class="fas fa-circle-info"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-field">
            <i class="fas fa-user-circle"></i>
            <input type="text" name="login_id" placeholder="Email or Username" required>
        </div>
        
        <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
        </div>

        <button type="submit" class="liquid-btn" style="width: fit-content; margin-top: 1rem;">
            <span class="liquid-btn-bg"></span>
            <span class="liquid-btn-glass"></span>
            <span class="liquid-btn-content">
                Sign In <i class="fas fa-right-to-bracket"></i>
            </span>
        </button>
    </form>
</div>

<script>
const togglePassword = document.querySelector('#togglePassword');
const password = document.querySelector('#password');

togglePassword.addEventListener('click', function (e) {
    // toggle the type attribute
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    // toggle the eye slash icon
    this.classList.toggle('fa-eye-slash');
});

// Check for registration success
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('registered')) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-success';
    alertDiv.innerHTML = '<i class="fas fa-check-circle"></i> <span>Registration complete! Please wait for admin approval.</span>';
    const titleEl = document.querySelector('.auth-title');
    if (titleEl) titleEl.after(alertDiv);
}

// Add loading state feedback on Sign In click
const loginForm = document.querySelector('.auth-form');
if (loginForm) {
    loginForm.addEventListener('submit', function () {
        const btn = loginForm.querySelector('.liquid-btn');
        if (btn) {
            const btnContent = btn.querySelector('.liquid-btn-content');
            if (btnContent) {
                btnContent.innerHTML = 'Signing In... <i class="fas fa-spinner fa-spin"></i>';
            }
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        }
    });
}
</script>

<style>
.auth-wrapper {
    max-width: 480px;
    width: 100%;
}

.auth-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 2rem;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.input-field {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 0 1.5rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 1.2rem;
}

.input-field:focus-within {
    border-color: #22d3ee;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
}

.input-field i {
    color: rgba(255, 255, 255, 0.4);
    margin-right: 1.2rem;
    font-size: 1.1rem;
}

.toggle-password {
    cursor: pointer;
    margin-left: auto;
    margin-right: 0 !important;
    z-index: 2;
    color: rgba(255, 255, 255, 0.4) !important;
    transition: color 0.3s;
}

.toggle-password:hover {
    color: #22d3ee !important;
}

.input-field input {
    width: 100%;
    height: 58px;
    border: none;
    background: none;
    outline: none;
    font-size: 1rem;
    color: #ffffff;
    font-family: 'Space Grotesk', sans-serif;
}

.input-field input::placeholder {
    color: rgba(255, 255, 255, 0.35);
}

.alert {
    padding: 1.2rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.95rem;
    font-weight: 500;
    backdrop-filter: blur(5px);
}

.alert-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.25);
}

.alert-success {
    background: rgba(34, 197, 94, 0.15);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.25);
}

.alert-warning {
    background: rgba(234, 179, 8, 0.15);
    color: #fde047;
    border: 1px solid rgba(234, 179, 8, 0.25);
}

.auth-footer {
    margin-top: 2.5rem;
    text-align: left;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.95rem;
    font-family: 'Space Grotesk', sans-serif;
}

.auth-footer a {
    color: #22d3ee;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}

.auth-footer a:hover {
    color: #ec4899;
    text-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
}
</style>
{% endblock %}
