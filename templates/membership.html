{% extends 'base.html' %}

{% block content %}
<section class="membership-section">
    <div class="glass-card membership-container">
        <h1>VRS Membership</h1>
        
        <!-- Shift Selector -->
        <div class="shift-selector">
            <button class="shift-btn active" data-shift="morning">Morning Shift</button>
            <button class="shift-btn" data-shift="evening">Evening Shift</button>
            <button class="shift-btn" data-shift="full">Full Day</button>
        </div>

        <div class="grid-header">
            <span>A1</span>
            <span>A2</span>
            <span>A3</span>
            <span>A4</span>
        </div>

        <!-- Seat Grid -->
        <div class="seat-grid" id="seat-grid">
            <!-- Seats will be generated by JS -->
        </div>
    </div>
</section>

<style>
.membership-section {
    padding-top: 80px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* Align to top to show more boxes */
    padding-bottom: 2rem;
}

.membership-container {
    max-width: 1200px;
    width: 98%;
    padding: 1.5rem;
    margin-top: 2rem;
}

.shift-selector {
    display: flex;
    gap: 0.5rem;
    margin: 1rem 0;
    justify-content: center;
}

.shift-btn {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    color: var(--text-color);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.3s ease;
}

.shift-btn.active {
    background: var(--accent-color);
    color: white;
}

.grid-header {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    text-align: center;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--accent-color);
    font-size: 0.9rem;
}

.seat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(20, auto);
    grid-auto-flow: column;
    gap: 4px; /* Minimal gap */
}

.seat {
    min-height: 40px; /* Smaller height */
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2px;
    transition: all 0.2s ease;
    overflow: hidden;
}

.seat:hover {
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.seat-id {
    font-size: 0.6rem;
    font-weight: 700;
    opacity: 0.7;
    margin-bottom: 2px;
}

.seat-user {
    font-size: 0.55rem;
    text-align: center;
    line-height: 1;
    word-break: break-word;
    font-weight: 500;
}

.seat.booked {
    background: #ff6b6b !important;
    color: white;
    border-color: #ee5253;
}

.seat.available {
    background: #eefaf3;
    color: #27ae60;
}

/* Hide detail overlay styles as requested */
.seat-detail { display: none; }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('seat-grid');
    const shiftBtns = document.querySelectorAll('.shift-btn');

    const mockBookings = {
        morning: {
            'A1-5': 'Aryan Maurya',
            'A2-10': 'John Doe',
            'A4-2': 'Jane Smith',
            'A1-12': 'Rahul S.',
            'A3-8': 'Priya S.'
        },
        evening: {
            'A1-1': 'Rahul Singh',
            'A3-15': 'Priya Sharma',
            'A4-20': 'Kevin Hart'
        },
        full: {
            'A1-5': 'Aryan Maurya',
            'A2-2': 'Amit Kumar',
            'A4-10': 'Suresh R.'
        }
    };

    let currentShift = 'morning';

    function generateSeats() {
        grid.innerHTML = '';
        for (let col = 1; col <= 4; col++) {
            for (let row = 1; row <= 20; row++) {
                const seatId = `A${col}-${row}`;
                const seat = document.createElement('div');
                seat.className = 'seat';
                
                const user = mockBookings[currentShift][seatId];
                
                if (user) {
                    seat.classList.add('booked');
                    seat.innerHTML = `
                        <div class="seat-id">${seatId}</div>
                        <div class="seat-user">${user}</div>
                    `;
                } else {
                    seat.classList.add('available');
                    seat.innerHTML = `
                        <div class="seat-id">${seatId}</div>
                        <div class="seat-user">Vacant</div>
                    `;
                }

                grid.appendChild(seat);
            }
        }
    }

    shiftBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            shiftBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentShift = btn.dataset.shift;
            generateSeats();
        });
    });

    generateSeats();
});
</script>
{% endblock %}
