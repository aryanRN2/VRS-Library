{% extends 'base.html' %}

{% block content %}
<section class="membership-section">
    <div class="glass-card membership-container">
        <div class="header-flex">
            <h1>VRS Membership</h1>
            {% if is_admin %}
            <span class="admin-badge">Admin Mode</span>
            {% endif %}
        </div>
        
        <!-- Shift Selector -->
        <div class="shift-selector">
            <button class="shift-btn active" data-shift="morning">Morning Shift</button>
            <button class="shift-btn" data-shift="evening">Evening Shift</button>
            <button class="shift-btn" data-shift="full">Full Day</button>
        </div>

        <div class="grid-header">
            <span>A1</span>
            <span>A2</span>
            <span>A3</span>
            <span>A4</span>
        </div>

        <!-- Seat Grid -->
        <div class="seat-grid" id="seat-grid">
            <!-- Seats will be generated by JS -->
        </div>

        <!-- Waiting Room Section -->
        <div class="waiting-room-section">
            <h2>Waiting Room</h2>
            <div id="waiting-list" class="waiting-list">
                <!-- Waiting users will appear here -->
            </div>
        </div>
    </div>
</section>

<!-- Simple Booking Modal -->
<div id="booking-modal" class="modal hidden">
    <div class="modal-content glass-card">
        <h3>Book Seat <span id="modal-seat-id"></span></h3>
        <input type="text" id="user-name-input" placeholder="Enter Your Name" class="glass-input">
        <div class="modal-btns">
            <button id="confirm-book" class="glass-btn">Book Now</button>
            <button id="close-modal" class="glass-btn secondary">Cancel</button>
        </div>
    </div>
</div>

<style>
.membership-section {
    padding-top: 80px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-bottom: 5rem;
}

.membership-container {
    max-width: 1200px;
    width: 98%;
    padding: 1.5rem;
    margin-top: 2rem;
}

.header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.admin-badge {
    background: #4285F4;
    color: white;
    padding: 0.3rem 0.8rem;
    border-radius: 1rem;
    font-size: 0.8rem;
    font-weight: 600;
}

.shift-selector {
    display: flex;
    gap: 0.5rem;
    margin: 1rem 0;
    justify-content: center;
}

.shift-btn {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    color: var(--text-color);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.3s ease;
}

.shift-btn.active {
    background: var(--accent-color);
    color: white;
}

.grid-header {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    text-align: center;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--accent-color);
    font-size: 0.9rem;
}

.seat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(20, auto);
    grid-auto-flow: column;
    gap: 4px;
}

.seat {
    min-height: 50px;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: all 0.2s ease;
    position: relative;
}

.seat-id {
    font-size: 0.6rem;
    font-weight: 700;
    opacity: 0.7;
}

.seat-user {
    font-size: 0.55rem;
    text-align: center;
    font-weight: 500;
    margin: 2px 0;
}

.seat.booked { background: #ff6b6b !important; color: white; }
.seat.available { background: #eefaf3; color: #27ae60; cursor: pointer; }

.admin-action {
    font-size: 0.5rem;
    background: rgba(0,0,0,0.1);
    border: none;
    padding: 2px 5px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 2px;
}

.waiting-room-section {
    margin-top: 4rem;
    border-top: 1px solid var(--glass-border);
    padding-top: 2rem;
}

.waiting-list {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1rem;
}

.waiting-item {
    background: var(--glass-bg);
    padding: 0.5rem 1rem;
    border-radius: 1rem;
    border: 1px solid var(--glass-border);
    font-size: 0.8rem;
}

/* Modal */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal.hidden { display: none; }

.modal-content {
    width: 300px;
    padding: 2rem;
    text-align: center;
}

.glass-input {
    width: 100%;
    padding: 0.8rem;
    margin: 1rem 0;
    border-radius: 0.5rem;
    border: 1px solid var(--glass-border);
}

.modal-btns {
    display: flex;
    gap: 0.5rem;
}
</style>

<script>
const isAdmin = {{ 'true' if is_admin else 'false' }};
let currentShift = 'morning';
let selectedSeat = null;

document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('seat-grid');
    const shiftBtns = document.querySelectorAll('.shift-btn');
    const modal = document.getElementById('booking-modal');
    const closeBtn = document.getElementById('close-modal');
    const confirmBtn = document.getElementById('confirm-book');

    async function loadSeats() {
        const res = await fetch(`/api/seats?shift=${currentShift}`);
        const seats = await res.json();
        renderGrid(seats);
        loadWaitingRoom();
    }

    function renderGrid(seats) {
        grid.innerHTML = '';
        seats.forEach(seat => {
            const el = document.createElement('div');
            el.className = `seat ${seat.user ? 'booked' : 'available'}`;
            
            let content = `<div class="seat-id">${seat.id}</div>
                           <div class="seat-user">${seat.user || 'Vacant'}</div>`;
            
            if (isAdmin && seat.user) {
                content += `<button class="admin-action" onclick="removeSeat('${seat.id}')">Remove</button>`;
            }
            
            el.innerHTML = content;
            
            if (!seat.user) {
                el.onclick = () => openBooking(seat.id);
            }
            
            grid.appendChild(el);
        });
    }

    async function loadWaitingRoom() {
        const res = await fetch('/api/waiting_room');
        const data = await res.json();
        const list = document.getElementById('waiting-list');
        list.innerHTML = data.map(w => `
            <div class="waiting-item">
                <b>${w.user_name}</b> (from ${w.seat})
            </div>
        `).join('');
    }

    window.removeSeat = async (id) => {
        const res = await fetch('/api/admin/remove', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({seat_id: id, shift: currentShift})
        });
        if (res.ok) loadSeats();
    };

    function openBooking(id) {
        selectedSeat = id;
        document.getElementById('modal-seat-id').innerText = id;
        modal.classList.remove('hidden');
    }

    confirmBtn.onclick = async () => {
        const name = document.getElementById('user-name-input').value;
        if (!name) return alert('Please enter name');
        
        const res = await fetch('/api/book', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({seat_id: selectedSeat, user_name: name, shift: currentShift})
        });
        
        if (res.ok) {
            modal.classList.add('hidden');
            loadSeats();
        }
    };

    closeBtn.onclick = () => modal.classList.add('hidden');

    shiftBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            shiftBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentShift = btn.dataset.shift;
            loadSeats();
        });
    });

    loadSeats();
});
</script>
{% endblock %}
