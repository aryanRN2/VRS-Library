{% extends 'base.html' %}

{% block content %}
<section class="membership-section">
    <div class="glass-card membership-container">
        <div class="header-flex">
            <h1>VRS Membership</h1>
            {% if is_admin %}
            <span class="admin-badge">Admin Mode</span>
            {% endif %}
        </div>
        
        <div class="shift-selector">
            <button class="shift-btn active" data-shift="morning">Morning Shift</button>
            <button class="shift-btn" data-shift="evening">Evening Shift</button>
            <button class="shift-btn" data-shift="full">Full Day</button>
        </div>

        <div class="grid-header">
            <span>A1</span><span>A2</span><span>A3</span><span>A4</span>
        </div>

        <div class="seat-grid" id="seat-grid"></div>

        <div class="waiting-room-section">
            <h2>Waiting Room</h2>
            <div id="waiting-list" class="waiting-list"></div>
        </div>
    </div>
</section>

<!-- Booking Modal -->
<div id="booking-modal" class="modal hidden">
    <div class="modal-content glass-card wide-modal">
        <h3>Seat Enrollment <span id="modal-seat-id"></span></h3>
        <div class="form-grid">
            <input type="text" id="user-name-input" placeholder="Full Name" class="glass-input">
            <input type="tel" id="user-phone-input" placeholder="Phone Number" class="glass-input">
            <input type="email" id="user-email-input" placeholder="Email Address" class="glass-input">
            <select id="user-purpose-input" class="glass-input">
                <option value="" disabled selected>Select Purpose</option>
                <option value="Preparation for Govt Job">Preparation for Govt Job</option>
                <option value="IIT">IIT</option>
                <option value="NEET">NEET</option>
                <option value="10/12 Board">10/12 Board</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <textarea id="user-desc-input" placeholder="Describe your purpose..." class="glass-input hidden" rows="2"></textarea>
        <div class="modal-btns">
            <button id="confirm-book" class="glass-btn">Submit Request</button>
            <button class="glass-btn secondary close-btn">Cancel</button>
        </div>
    </div>
</div>

<!-- Admin Multi-Review Modal -->
<div id="approval-modal" class="modal hidden">
    <div class="modal-content glass-card wide-modal">
        <h3>Seat <span id="approve-seat-id"></span>: Review Requests</h3>
        
        <div id="requests-list" class="requests-container">
            <!-- List of all pending users for this seat -->
        </div>

        <div id="allotment-controls" class="allotment-section hidden">
            <hr>
            <p>Approve <b id="target-user-name"></b> for:</p>
            <div class="preset-btns">
                <button class="preset-btn" data-days="4">4 Days</button>
                <button class="preset-btn active" data-days="30">1 Month</button>
            </div>
            <input type="date" id="expiry-date-input" class="glass-input">
            <div class="modal-btns">
                <button id="final-approve-btn" class="glass-btn">Complete Allotment</button>
                <button id="back-to-list" class="glass-btn secondary">Back</button>
            </div>
        </div>
        
        <div class="modal-btns" id="review-close-btns">
            <button class="glass-btn secondary close-btn">Close</button>
        </div>
    </div>
</div>

<style>
.membership-section { padding-top: 80px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-bottom: 5rem; }
.membership-container { max-width: 1200px; width: 98%; padding: 1.5rem; margin-top: 2rem; }
.header-flex { display: flex; justify-content: space-between; align-items: center; }
.admin-badge { background: #4285F4; color: white; padding: 0.3rem 0.8rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 600; }
.shift-selector { display: flex; gap: 0.5rem; margin: 1rem 0; justify-content: center; }
.shift-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 2rem; color: var(--text-color); cursor: pointer; font-size: 0.8rem; transition: all 0.3s ease; }
.shift-btn.active { background: var(--accent-color); color: white; }
.grid-header { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; font-weight: 600; margin-bottom: 0.5rem; color: var(--accent-color); font-size: 0.9rem; }
.seat-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(20, auto); grid-auto-flow: column; gap: 4px; }
.seat { min-height: 55px; background: rgba(255, 255, 255, 0.8); border: 1px solid var(--glass-border); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; transition: all 0.2s ease; position: relative; }
.seat-id { font-size: 0.6rem; font-weight: 700; opacity: 0.7; }
.seat-user { font-size: 0.55rem; text-align: center; font-weight: 600; margin: 2px 0; }
.seat.booked, .seat.approved { background: #ff6b6b !important; color: white; border-color: #ee5253; }
.seat.available { background: #eefaf3; color: #27ae60; cursor: pointer; }
.seat.pending { background: #feca57; color: #333; }
.blink-yellow { animation: blinker 1.5s linear infinite; background: #feca57 !important; }
@keyframes blinker { 50% { opacity: 0.5; } }

.request-count { position: absolute; top: -5px; right: -5px; background: #FBBC05; color: #000; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; font-weight: bold; border: 1px solid white; }

.admin-action { font-size: 0.5rem; background: rgba(0,0,0,0.1); border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; margin-top: 2px; }
.admin-action.approve { background: #2ecc71; color: white; }
.admin-action.reject { background: #e74c3c; color: white; }

.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
.modal.hidden { display: none !important; }
.wide-modal { width: 480px !important; }
.requests-container { max-height: 300px; overflow-y: auto; margin: 1rem 0; text-align: left; }
.request-card { background: white; border: 1px solid var(--glass-border); padding: 0.8rem; border-radius: 0.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
.request-info p { margin: 0; font-size: 0.8rem; }
.request-info b { color: var(--accent-color); font-size: 0.9rem; }

.waiting-room-section { margin-top: 4rem; border-top: 1px solid var(--glass-border); padding-top: 2rem; }
.waiting-list { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
.waiting-item { background: var(--glass-bg); padding: 0.5rem 1rem; border-radius: 1rem; border: 1px solid var(--glass-border); font-size: 0.8rem; }

.glass-input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border-radius: 0.5rem; border: 1px solid var(--glass-border); background: white; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.modal-btns { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center; }
.hidden { display: none !important; }
</style>

<script>
const isAdmin = {{ 'true' if is_admin else 'false' }};
let currentShift = 'morning';
let selectedSeat = null;
let currentRequests = [];
let targetBookingId = null;

document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('seat-grid');
    const shiftBtns = document.querySelectorAll('.shift-btn');
    const bookingModal = document.getElementById('booking-modal');
    const approvalModal = document.getElementById('approval-modal');
    const expiryInput = document.getElementById('expiry-date-input');
    const purposeSelect = document.getElementById('user-purpose-input');
    const descArea = document.getElementById('user-desc-input');

    const getDefaultDate = (days = 30) => {
        const d = new Date(); d.setDate(d.getDate() + days);
        return d.toISOString().split('T')[0];
    };
    expiryInput.value = getDefaultDate(30);

    purposeSelect.onchange = () => {
        if (purposeSelect.value === 'Other') descArea.classList.remove('hidden');
        else descArea.classList.add('hidden');
    };

    async function loadSeats() {
        try {
            const res = await fetch(`/api/seats?shift=${currentShift}&admin=${isAdmin}`);
            const seats = await res.json();
            renderGrid(seats);
            loadWaitingRoom();
        } catch (e) { console.error(e); }
    }

    function renderGrid(seats) {
        grid.innerHTML = '';
        seats.forEach(seat => {
            const el = document.createElement('div');
            el.className = `seat ${seat.status || 'available'}`;
            
            let content = `<div class="seat-id">${seat.id}</div>
                           <div class="seat-user">${seat.approved_user ? seat.approved_user.user : (seat.user || 'Vacant')}</div>`;
            
            if (isAdmin) {
                if (seat.pending_requests && seat.pending_requests.length > 0) {
                    el.classList.add('blink-yellow');
                    content += `<div class="request-count">${seat.pending_requests.length} Req</div>`;
                    content += `<button class="admin-action approve" onclick='openMultiReview(${JSON.stringify(seat.pending_requests)}, "${seat.id}")'>Review</button>`;
                } else if (seat.status === 'approved') {
                    content += `<button class="admin-action" onclick="removeSeat('${seat.id}')">Remove</button>`;
                }
            }
            
            el.innerHTML = content;
            if (!seat.status || seat.status === 'available' || seat.status === 'pending') {
                el.onclick = () => openBooking(seat.id);
            }
            grid.appendChild(el);
        });
    }

    window.openMultiReview = (requests, seatId) => {
        selectedSeat = seatId;
        currentRequests = requests;
        document.getElementById('approve-seat-id').innerText = seatId;
        renderRequestsList();
        approvalModal.classList.remove('hidden');
        document.getElementById('allotment-controls').classList.add('hidden');
        document.getElementById('requests-list').classList.remove('hidden');
        document.getElementById('review-close-btns').classList.remove('hidden');
    };

    function renderRequestsList() {
        const list = document.getElementById('requests-list');
        list.innerHTML = currentRequests.map(req => `
            <div class="request-card">
                <div class="request-info">
                    p><b>${req.user}</b></p>
                    <p>${req.phone} | ${req.purpose}</p>
                </div>
                <button class="glass-btn" onclick="prepareApproval(${req.id}, '${req.user}')">Pick</button>
            </div>
        `).join('');
    }

    window.prepareApproval = (id, name) => {
        targetBookingId = id;
        document.getElementById('target-user-name').innerText = name;
        document.getElementById('requests-list').classList.add('hidden');
        document.getElementById('review-close-btns').classList.add('hidden');
        document.getElementById('allotment-controls').classList.remove('hidden');
    };

    document.getElementById('back-to-list').onclick = () => {
        document.getElementById('allotment-controls').classList.add('hidden');
        document.getElementById('requests-list').classList.remove('hidden');
        document.getElementById('review-close-btns').classList.remove('hidden');
    };

    document.getElementById('final-approve-btn').onclick = async () => {
        const res = await fetch('/api/admin/approve', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({booking_id: targetBookingId, expiry_date: expiryInput.value})
        });
        if (res.ok) { approvalModal.classList.add('hidden'); loadSeats(); }
    };

    window.removeSeat = async (id) => {
        const res = await fetch('/api/admin/remove', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({seat_id: id, shift: currentShift})
        });
        if (res.ok) loadSeats();
    };

    function openBooking(id) {
        selectedSeat = id;
        document.getElementById('modal-seat-id').innerText = id;
        bookingModal.classList.remove('hidden');
    }

    document.getElementById('confirm-book').onclick = async () => {
        const payload = {
            seat_id: selectedSeat, shift: currentShift,
            user_name: document.getElementById('user-name-input').value,
            phone: document.getElementById('user-phone-input').value,
            email: document.getElementById('user-email-input').value,
            purpose: purposeSelect.value, desc: descArea.value
        };
        if (!payload.user_name || !payload.phone || !payload.purpose) return alert('Fill required fields');
        const res = await fetch('/api/book', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) { bookingModal.classList.add('hidden'); loadSeats(); }
    };

    document.querySelectorAll('.close-btn').forEach(btn => {
        btn.onclick = () => { bookingModal.classList.add('hidden'); approvalModal.classList.add('hidden'); };
    });

    shiftBtns.forEach(btn => {
        btn.onclick = () => {
            shiftBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentShift = btn.dataset.shift;
            loadSeats();
        };
    });

    loadSeats();

    async function loadWaitingRoom() {
        const res = await fetch('/api/waiting_room');
        const data = await res.json();
        document.getElementById('waiting-list').innerHTML = data.map(w => `
            <div class="waiting-item"><b>${w.user_name}</b> (from ${w.seat})</div>
        `).join('');
    }
});
</script>
{% endblock %}
