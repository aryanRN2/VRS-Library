{% extends 'base.html' %}

{% block content %}
<div class="hero-content-wrapper">
    <!-- Brand Logo / Headline -->
    <h1 class="brand-logo">VRS LIBRARY</h1>

    <!-- Minimal Tagline -->
    <p class="minimal-tagline">Crafting the future in focus</p>

    <!-- CTA Buttons -->
    <div class="btn-group">
        <!-- About Library (Map Link) -->
        <a href="https://maps.app.goo.gl/mpW3JwUdizNNcfyC9" target="_blank" class="liquid-btn">
            <span class="liquid-btn-bg"></span>
            <span class="liquid-btn-glass"></span>
            <span class="liquid-btn-content">
                <i class="fa-solid fa-map-location-dot"></i> About Library
            </span>
        </a>

        <!-- Login or Dashboard (Dynamic) -->
        {% if current_user.is_authenticated %}
            {% if current_user.is_admin %}
                <a href="{{ url_for('admin_dashboard') }}" class="liquid-btn">
                    <span class="liquid-btn-bg"></span>
                    <span class="liquid-btn-glass"></span>
                    <span class="liquid-btn-content">
                        <i class="fa-solid fa-chart-line"></i> Go to Dashboard
                    </span>
                </a>
            {% else %}
                <a href="{{ url_for('membership') }}" class="liquid-btn">
                    <span class="liquid-btn-bg"></span>
                    <span class="liquid-btn-glass"></span>
                    <span class="liquid-btn-content">
                        <i class="fa-solid fa-user"></i> Go to Dashboard
                    </span>
                </a>
            {% endif %}
        {% else %}
            <a href="{{ url_for('login') }}" class="liquid-btn">
                <span class="liquid-btn-bg"></span>
                <span class="liquid-btn-glass"></span>
                <span class="liquid-btn-content">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </span>
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
