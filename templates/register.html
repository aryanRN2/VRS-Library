{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
    <div class="glass-card auth-container">
        <div class="auth-header">
            <i class="fas fa-user-plus main-icon"></i>
            <h1>Create Account</h1>
            <p>Join the VRS Library elite circle.</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-field full-width" style="margin-bottom: 1.2rem;">
                <i class="fas fa-at"></i>
                <input type="text" name="username" placeholder="Choose Username" required>
            </div>

            <div class="input-group">
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email Address (Optional)">
                </div>
            </div>

            <div class="input-group">
                <div class="input-field">
                    <i class="fas fa-phone"></i>
                    <span class="country-code">+91</span>
                    <input type="tel" name="phone" placeholder="Phone Number" pattern="[0-9]{10}" maxlength="10" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="Create Password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="input-field full-width">
                <i class="fas fa-graduation-cap"></i>
                <select name="purpose" required id="purpose-select">
                    <option value="" disabled selected>Purpose of Enrollment</option>
                    <option value="Preparation for Govt Job">Preparation for Govt Job</option>
                    <option value="IIT">IIT</option>
                    <option value="NEET">NEET</option>
                    <option value="10/12 Board">10/12 Board</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <textarea name="description" id="other-desc" placeholder="Tell us more about your goals..." class="glass-input hidden" rows="3"></textarea>

            <button type="submit" class="premium-btn">
                <span>Register Now</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <span>Already part of VRS?</span>
            <a href="{{ url_for('login') }}">Sign In <i class="fas fa-sign-in-alt"></i></a>
        </div>
    </div>
</section>

<style>
.toggle-password {
    cursor: pointer;
    margin-left: -30px;
    margin-right: 0 !important;
    z-index: 2;
    color: #aaa;
    transition: color 0.3s;
}

.toggle-password:hover {
    color: var(--accent-color);
}
.auth-section {
    padding-top: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at top right, rgba(66, 133, 244, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(52, 168, 83, 0.05), transparent);
}

.auth-container {
    max-width: 550px;
    width: 95%;
    padding: 3.5rem;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.auth-header { margin-bottom: 2.5rem; text-align: center; }
.main-icon { font-size: 2.5rem; color: var(--accent-color); margin-bottom: 1rem; }
.auth-header h1 { font-size: 2.2rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.5rem; }
.auth-header p { color: #666; font-size: 1rem; }

.input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }

.input-field {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 0 1.2rem;
    transition: all 0.3s ease;
}

.input-field:focus-within {
    border-color: var(--accent-color);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.1);
}

.input-field i { color: #aaa; margin-right: 1rem; font-size: 1.1rem; }
.country-code { font-weight: 700; color: var(--accent-color); margin-right: 0.5rem; font-size: 0.95rem; }
.input-field input, .input-field select {
    width: 100%;
    height: 50px;
    border: none;
    background: none;
    outline: none;
    font-size: 0.95rem;
    color: var(--text-color);
    font-family: inherit;
}

.full-width { grid-column: span 2; margin-bottom: 1.2rem; }

.premium-btn {
    width: 100%;
    height: 55px;
    background: linear-gradient(135deg, #4285F4, #34A853);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    margin-top: 1rem;
}

.premium-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
}

.auth-footer { margin-top: 2rem; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 1.5rem; font-size: 0.95rem; }
.auth-footer a { color: var(--accent-color); font-weight: 600; text-decoration: none; margin-left: 5px; }

.hidden { display: none; }
#other-desc { width: 100%; margin-bottom: 1.2rem; border-radius: 12px; padding: 1rem; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.6); font-family: inherit; outline: none; }

.photo-upload-container { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin: 2rem 0; }
.photo-preview { width: 150px; height: 150px; border-radius: 50%; background: #f0f0f0; border: 3px dashed #ddd; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.photo-preview i { font-size: 3rem; color: #ccc; align-self: center; }
.photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.photo-hint { font-size: 0.8rem; color: #888; margin-top: -1rem; }
.glass-btn.secondary { background: rgba(0,0,0,0.05); color: #444; border: 1px solid #ddd; padding: 0.8rem 1.5rem; border-radius: 10px; cursor: pointer; font-weight: 600; }
.text-btn { background: none; border: none; color: #888; font-size: 0.9rem; cursor: pointer; margin-top: 1rem; width: 100%; text-decoration: underline; }
.compression-status { font-size: 0.85rem; color: var(--accent-color); margin-bottom: 1rem; font-weight: 600; text-align: center; }
@media (max-width: 600px) {
    .input-group { grid-template-columns: 1fr; }
    .full-width { grid-column: span 1; }
    .auth-container { padding: 2rem; }
}
</style>

<script>
document.getElementById('purpose-select').onchange = function() {
    const desc = document.getElementById('other-desc');
    if (this.value === 'Other') desc.classList.remove('hidden');
    else desc.classList.add('hidden');
};

const togglePassword = document.querySelector('#togglePassword');
const password = document.querySelector('#password');

togglePassword.addEventListener('click', function (e) {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    this.classList.toggle('fa-eye-slash');
});
</script>
{% endblock %}
