<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRS Library | Future of Learning</title>
    <meta name="description" content="VRS Library - A next-generation library management system with immersive particle technology.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
        window.getCsrfToken = () => document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
    </script>
</head>
<body class="{{ 'home-page' if request.endpoint == 'index' else 'static-page' }}">
    {% if request.endpoint == 'index' %}
    <div id="canvas-container"></div>
    {% endif %}
    
    <main>
        {% block content %}{% endblock %}
    </main>

    {% if request.endpoint == 'index' %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=1.0.1"></script>
    {% endif %}
</body>
</html>
